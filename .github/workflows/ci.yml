name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    needs: build
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install coverage

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest \
            tests/user_service/test_service_unit.py \
            tests/user_api/test_api_unit.py \
            tests/listening/test_spotify_connection_safety.py \
            tests/listening/test_spotify_refresh_and_revoke.py \
            tests/listening/test_recommendations.py \
            -v

      - name: Generate coverage report
        run: python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
